version: "3.8"
services:
  influx:
    image: influxdb:2.7.11
    ports: [ "8086:8086" ]
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=dev
      - DOCKER_INFLUXDB_INIT_PASSWORD=devpassdevpass
      - DOCKER_INFLUXDB_INIT_ORG=dev
      - DOCKER_INFLUXDB_INIT_BUCKET=profiling
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=devtoken
    volumes: [ "influx-data:/var/lib/influxdb2" ]

  grafana:
    image: grafana/grafana:12.0.0
    ports: [ "3000:3000" ]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on: [ influx ]
    volumes: [ "grafana-data:/var/lib/grafana" ]

volumes:
  influx-data:
  grafana-data:
